name: jinatest
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0"
          curl -sL --compressed -m 60 -A "$UA" -o rank.txt "https://r.jina.ai/https://www.hltv.org/ranking/teams" || true
          curl -sL --compressed -m 60 -A "$UA" -o team.txt "https://r.jina.ai/https://www.hltv.org/team/6667/tyloo" || true
          curl -sL --compressed -m 60 -A "$UA" -o player.txt "https://r.jina.ai/https://www.hltv.org/player/21167/donk" || true
          wc -c rank.txt team.txt player.txt
      - name: commit
        run: |
          git config user.name "cs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rank.txt team.txt player.txt
          git commit -m "jina fetch" || true
          git push || true
