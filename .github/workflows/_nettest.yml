name: nettest
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 测试各站可达性
        run: |
          : > nettest-result.txt
          test() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0" "$2" || echo ERR)
            echo "$code|$1|$2" >> nettest-result.txt
          }
          test "HLTV 首页"       "https://www.hltv.org/"
          test "HLTV 战队排名"   "https://www.hltv.org/ranking/teams"
          test "HLTV TYLOO 页"   "https://www.hltv.org/team/6667/tyloo"
          test "HLTV 选手页"     "https://www.hltv.org/player/11816/zywoo"
          test "HLTV stats"      "https://www.hltv.org/stats/players"
          test "Liquipedia API"  "https://liquipedia.net/counterstrike/api.php?action=query&meta=siteinfo&format=json"
          test "PandaScore"      "https://api.pandascore.co/"
          test "BLAST.tv 排名"   "https://blast.tv/cs/ranking"
          test "5EPlay"          "https://csgo.5eplay.com/"
          cat nettest-result.txt
      - name: 提交结果
        run: |
          git config user.name "cs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add nettest-result.txt
          git commit -m "nettest result" || true
          git push || true
