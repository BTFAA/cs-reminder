name: proxytest
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: |
          : > proxy-result.txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0"
          HLTV="https://www.hltv.org/ranking/teams"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=chr(0)))" "$HLTV")
          test() {
            code=$(curl -sL --compressed -m 45 -A "$UA" -o /tmp/b -w "%{http_code}" "$2" 2>/dev/null || echo ERR)
            sz=$(wc -c < /tmp/b 2>/dev/null || echo 0)
            hit=""
            grep -qi "vitality" /tmp/b 2>/dev/null && hit="$hit VITALITY"
            grep -qi "ranking" /tmp/b 2>/dev/null && hit="$hit ranking"
            echo "$code|$sz|$1|$hit" >> proxy-result.txt
          }
          test "r.jina.ai -> HLTV"        "https://r.jina.ai/https://www.hltv.org/ranking/teams"
          test "allorigins -> HLTV"        "https://api.allorigins.win/raw?url=$ENC"
          test "codetabs -> HLTV"          "https://api.codetabs.com/v1/proxy?quest=$ENC"
          test "corsproxy -> HLTV"         "https://corsproxy.io/?$ENC"
          test "whateverorigin -> HLTV"    "http://www.whateverorigin.org/get?url=$ENC"
          test "thingproxy -> HLTV"        "https://thingproxy.freeboard.io/fetch/https://www.hltv.org/ranking/teams"
          test "bo3.gg /rankings"          "https://bo3.gg/rankings"
          test "bo3.gg /cs2/rankings"      "https://bo3.gg/cs2/rankings/teams"
          test "escharts /rankings"        "https://escharts.com/rankings"
          test "escharts cs-go"            "https://escharts.com/rankings/cs-go"
          cat proxy-result.txt
      - name: commit
        run: |
          git config user.name "cs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add proxy-result.txt
          git commit -m "proxy test" || true
          git push || true
