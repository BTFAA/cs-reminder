name: CS2 指令监听（交互式）

# 你 @机器人 说话就回复。连 QQ 的 WebSocket 长连接，每小时重启一次。
# 仓库里有 data/ 缓存，战队/选手/HLTV 数据都缓着，所以查询是秒回。

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: qq-listen
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 62

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复缓存（让查询秒回）
        uses: actions/cache@v4
        with:
          path: data
          key: cs-data-${{ github.run_id }}
          restore-keys: |
            cs-data-

      - name: 监听 QQ 指令
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OPENID: ${{ secrets.QQ_OPENID }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
        run: timeout -s INT 3300 python run.py --listen || true
