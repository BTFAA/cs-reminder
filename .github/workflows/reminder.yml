name: CS2 赛事提醒

on:
  # 定时推送已按你的要求关闭（原来这里是 cron: "*/30 * * * *"）
  # 想恢复就在下面加回：
  #   schedule:
  #     - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "normal"
        type: choice
        options:
          - normal   # 正常：到提醒时点才推
          - now      # 立即推送关注队伍全部待赛赛程
          - test     # 发一条通道测试消息
          - check    # 只检查数据源，不推送
          - preview  # 打印要推的内容但不发送

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复「已推送记录」（避免重复提醒）
        uses: actions/cache@v4
        with:
          path: data
          key: cs-state-${{ github.run_id }}
          restore-keys: |
            cs-state-

      - name: 运行提醒程序
        env:
          QQ_APPID:    ${{ secrets.QQ_APPID }}
          QQ_SECRET:   ${{ secrets.QQ_SECRET }}
          QQ_OPENID:   ${{ secrets.QQ_OPENID }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          case "$MODE" in
            now)     python run.py --now ;;
            test)    python run.py --test ;;
            check)   python run.py --check ;;
            preview) python run.py --dry-run --force ;;
            *)       python run.py ;;
          esac

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reminder-log
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
