name: CS2 赛后战报
on:
  schedule:
    - cron: "15 */3 * * *"        # 每 3 小时检查一次（UTC）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cs-results
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 恢复已推送记录
        uses: actions/cache@v4
        with:
          path: data
          key: cs-results-${{ github.run_id }}
          restore-keys: |
            cs-results-
      - name: 检查赛果
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_OPENID: ${{ secrets.QQ_OPENID }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
        run: python run.py --results
