name: selftest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: data
          key: cs-data-${{ github.run_id }}
          restore-keys: |
            cs-data-
      - name: 在线搜索兜底测试
        run: |
          : > speed.txt
          python - << 'PYEOF' 2>&1 | tee -a speed.txt
          import sys, time
          sys.path.insert(0, '.')
          from csreminder import config as cfgmod, main
          from csreminder.sources import hltv
          cfg = cfgmod.load()
          print('字典:', len(hltv.all_players()), '人')
          print()
          print('== 之前找不到的 ==')
          for n in ['f0rest','olofmeister','shox','flusha','dupreeh','electronic']:
              t0 = time.time()
              r = main._smart_ask(cfg, n, '') or ''
              first = r.strip().split(chr(10))[0]
              print('  %-14s %-42s %.1fs' % (n, first[:42], time.time()-t0))
          print()
          print('== 在线搜索原始返回 ==')
          for n in ['f0rest','electronic']:
              try:
                  print('  %-12s -> %s' % (n, hltv.search_online(n)))
              except Exception as e:
                  print('  %-12s -> 失败 %s' % (n, str(e)[:60]))
          print()
          print('== 再确认没回归 ==')
          for n in ['donk','天禄','你好','赛事推送','世界排名']:
              r = main._smart_ask(cfg, n, '') or ''
              print('  %-12s -> %s' % (n, r.strip().split(chr(10))[0][:44]))
          PYEOF
      - name: commit
        run: |
          git config user.name "cs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add speed.txt
          git commit -m "online search test" || true
          git push || true
