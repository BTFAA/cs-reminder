name: selftest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: data
          key: cs-data-${{ github.run_id }}
          restore-keys: |
            cs-data-
      - name: 查找正确性测试
        run: |
          : > speed.txt
          python - << 'PYEOF' 2>&1 | tee -a speed.txt
          import sys
          sys.path.insert(0, '.')
          from csreminder import config as cfgmod
          from csreminder.sources import hltv, blastteams
          cfg = cfgmod.load()
          print('全量字典:', len(hltv.all_players()), '人')
          print()
          def look(n):
              p = None
              try: p = blastteams.find_player(cfg, n, strict=True)
              except Exception: pass
              if not p:
                  try: p = blastteams.find_player(cfg, n)
                  except Exception: pass
              src = 'BLAST'
              if not p:
                  hp = hltv.find_player(n)
                  if hp: p, src = hp, 'HLTV'
              return p, src
          print('== 曾经误命中的 ==')
          for n in ['dupreeh','electronic','NAF','simble']:
              p, s = look(n)
              print('  %-14s -> %-22s [%s]' % (n, (p or {}).get('name') or '没找到', s if p else '-'))
          print()
          print('== 常见选手 ==')
          hit = miss = 0
          for n in ['donk','ZywOo','s1mple','NiKo','m0NESY','device','sh1ro','Jee',
                    'ropz','apEX','flameZ','magixx','Twistzz','EliGE','b1t','Perfecto',
                    'f0rest','olofmeister','shox','GeT_RiGhT','JW','flusha']:
              p, s = look(n)
              if p: hit += 1
              else: miss += 1
              print('  %-14s -> %-22s [%s]' % (n, (p or {}).get('name') or '没找到', s if p else '-'))
          print()
          print('命中 %d / 未命中 %d' % (hit, miss))
          print()
          print('== 端到端：发一句话看回复 ==')
          from csreminder import main
          for q in ['dupreeh', 's1mple', 'electronic']:
              r = main._smart_ask(cfg, q, '')
              print('  发 %-12s -> %s' % (q, (r or '').strip().split(chr(10))[0][:46]))
          PYEOF
      - name: commit
        run: |
          git config user.name "cs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add speed.txt
          git commit -m "lookup test" || true
          git push || true
