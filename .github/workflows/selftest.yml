name: selftest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
        run: |
          : > selftest-out.txt
          for q in "帮助" "天禄" "donk" "tlyoo" "天禄下一场打谁" "绿龙最近赢了吗" "世界排名" "对比 donk ZywOo"; do
            echo "##### $q #####" >> selftest-out.txt
            timeout 220 python run.py --ask "$q" >> selftest-out.txt 2>&1
            echo >> selftest-out.txt
          done
          cat selftest-out.txt
      - name: commit
        run: |
          git config user.name "cs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add selftest-out.txt
          git commit -m "selftest" || true
          git push || true
