name: selftest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: data
          key: cs-data-${{ github.run_id }}
          restore-keys: |
            cs-data-
      - name: 真实路径测试（直接调 _smart_ask）
        run: |
          : > speed.txt
          python - << 'PYEOF' 2>&1 | tee -a speed.txt
          import sys, time
          sys.path.insert(0, '.')
          from csreminder import config as cfgmod, main
          from csreminder.sources import hltv
          cfg = cfgmod.load()
          print('全量字典:', len(hltv.all_players()), '人')
          print()
          NAMES = ['donk','ZywOo','s1mple','NiKo','m0NESY','device','sh1ro','Jee',
                   'ropz','apEX','flameZ','magixx','Twistzz','EliGE','b1t','Perfecto',
                   'f0rest','olofmeister','shox','flusha','GeT_RiGhT','JW','dupreeh',
                   'electronic','NAF','simble','DONK','zywoo','NiKo']
          hit = miss = wrong = 0
          BAD = {'pr','onic'}
          for n in NAMES:
              t0 = time.time()
              r = main._smart_ask(cfg, n, '') or ''
              first = r.strip().split(chr(10))[0]
              dt = time.time() - t0
              low = first.lower()
              if '没看懂' in first or not first:
                  print('❌ %-14s 没找到            %.1fs' % (n, dt)); miss += 1
              elif any(('选手数据' in first and b in low) for b in BAD):
                  print('❌ %-14s 误命中: %s' % (n, first[:40])); wrong += 1
              else:
                  print('✅ %-14s %-40s %.1fs' % (n, first[:40], dt)); hit += 1
          print()
          print('命中 %d / 没找到 %d / 误命中 %d' % (hit, miss, wrong))
          PYEOF
      - name: commit
        run: |
          git config user.name "cs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add speed.txt
          git commit -m "smartask test" || true
          git push || true
