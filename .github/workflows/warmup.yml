name: CS2 缓存预热

# 每小时 50 分把战队索引 / 选手索引 / HLTV 排名 全部拉一遍并存进缓存，
# 这样下一小时的监听任务一启动就是热的，你在 QQ 里问能秒回。

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

concurrency:
  group: cs-warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 恢复缓存（让查询秒回）
        uses: actions/cache@v4
        with:
          path: data
          key: cs-data-${{ github.run_id }}
          restore-keys: |
            cs-data-
      - name: 预热
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
        run: python run.py --warm
